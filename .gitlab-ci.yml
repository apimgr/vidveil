sbom:release:
  image: ${BUILD_IMAGE}
  stage: package
  needs:
    - build:linux-amd64
  script:
    - cyclonedx-gomod mod -json -output ${PROJECT_NAME}-${RELEASE_VERSION}-sbom.cdx.json
  artifacts:
    paths:
      - ${PROJECT_NAME}-${RELEASE_VERSION}-sbom.cdx.json
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/

