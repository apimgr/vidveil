stages:
  - build
  - test
  - package
  - release
  - docker

variables:
  PROJECT_NAME: "vidveil"
  PROJECT_ORG: "apimgr"
  CGO_ENABLED: "0"
  GOOS: "linux"
  GOARCH: "amd64"
  BUILD_IMAGE: "casjaysdev/go:latest"

.go-build-template: &go-build
  image: ${BUILD_IMAGE}
  before_script:
    - |
      if [ -f site.txt ]; then
        export OFFICIAL_SITE="$(cat site.txt)"
      else
        export OFFICIAL_SITE="${OFFICIAL_SITE:-}"
      fi

build:linux-amd64:
  <<: *go-build
  stage: build
  variables:
    GOOS: linux
    GOARCH: amd64
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - COMMIT_ID="$(git rev-parse --short=7 HEAD)"
    - BUILD_EPOCH="$(date -u +%s)"
    - LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitID=${COMMIT_ID}' -X 'main.BuildEpoch=${BUILD_EPOCH}' -X 'main.OfficialSite=${OFFICIAL_SITE}'"
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-linux-amd64 ./src
    - '[ -d src/client ] && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-amd64 ./src/client || true'
    - echo "RELEASE_VERSION=${VERSION}" > release.env
  artifacts:
    paths:
      - ${PROJECT_NAME}-linux-amd64
      - ${PROJECT_NAME}-cli-linux-amd64
    reports:
      dotenv: release.env
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/

