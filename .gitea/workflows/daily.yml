name: Daily Build

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: daily-${{ gitea.ref }}
  cancel-in-progress: ${{ gitea.ref == 'refs/heads/main' || gitea.ref == 'refs/heads/master' || gitea.ref == 'refs/heads/devel' || gitea.ref == 'refs/heads/dev' || gitea.ref == 'refs/heads/beta' }}

permissions:
  contents: read

env:
  PROJECT_NAME: vidveil

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      commit_id: ${{ steps.set.outputs.commit_id }}
      build_epoch: ${{ steps.set.outputs.build_epoch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Compute version
        id: set
        run: |
          COMMIT_ID="$(git rev-parse --short=7 HEAD)"
          echo "version=$COMMIT_ID" >> "$GITEA_OUTPUT"
          echo "commit_id=$COMMIT_ID" >> "$GITEA_OUTPUT"
          echo "build_epoch=$(date -u +%s)" >> "$GITEA_OUTPUT"

  build:
    needs: [version]
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set build info
        run: |
          echo "VERSION=${{ needs.version.outputs.version }}" >> "$GITEA_ENV"
          echo "COMMIT_ID=${{ needs.version.outputs.commit_id }}" >> "$GITEA_ENV"
          BUILD_EPOCH="${{ needs.version.outputs.build_epoch }}"
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> "$GITEA_ENV"
          echo "BUILD_DATE=$(date -u -d "@$BUILD_EPOCH" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITEA_ENV"
          if [ -f site.txt ]; then
            echo "OFFICIAL_SITE=$(cat site.txt)" >> "$GITEA_ENV"
          else
            echo "OFFICIAL_SITE=${{ secrets.OFFICIAL_SITE }}" >> "$GITEA_ENV"
          fi

      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildEpoch=${{ env.BUILD_EPOCH }}' -X 'main.OfficialSite=${{ env.OFFICIAL_SITE }}'"
          go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./src

      - name: Build CLI
        if: hashFiles('src/client/**') != ''
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildEpoch=${{ env.BUILD_EPOCH }}' -X 'main.OfficialSite=${{ env.OFFICIAL_SITE }}'"
          go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${{ env.PROJECT_NAME }}-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./src/client

      - name: Upload server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

      - name: Upload CLI artifact
        if: hashFiles('src/client/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.PROJECT_NAME }}-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: binaries
          merge-multiple: true

      - name: Create version.txt
        run: echo "${{ needs.version.outputs.version }}" > binaries/version.txt

      - name: Create source archive
        run: |
          ARCHIVE_NAME="${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-source.tar.gz"
          tar -czf "$ARCHIVE_NAME" --exclude=.git --exclude=.github --exclude=.gitea --exclude=.forgejo --exclude=binaries --exclude=releases --exclude='*.tar.gz' .
          mv "$ARCHIVE_NAME" binaries/

      - name: Generate checksums
        run: |
          cd binaries
          sha256sum * > sha256.txt
          sha512sum * > sha512.txt

      - name: Delete previous daily release
        run: |
          curl -X DELETE -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" "${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/releases/tags/daily" || true
          git push origin :refs/tags/daily 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: daily
          name: "Daily Build ${{ needs.version.outputs.version }}"
          files: binaries/*
          prerelease: true
          body: "Daily build: ${{ needs.version.outputs.version }}"
