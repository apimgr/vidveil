          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz"
        - name: "sha256.txt"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/sha256.txt"
        - name: "sha512.txt"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/sha512.txt"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docker:build:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}"
      fi
      COMMIT_ID="$(git rev-parse --short=7 HEAD)"
      BUILD_EPOCH="$(date -u +%s)"
      BUILD_DATE="$(date -u -d @${BUILD_EPOCH} +"%a %b %d, %Y at %H:%M:%S %Z")"
      YYMM="$(date -u +%y%m)"

      docker buildx create --use || true
      docker buildx inspect --bootstrap

      TAGS="-t ${CI_REGISTRY_IMAGE}:${COMMIT_ID}"
      if [ -n "${CI_COMMIT_TAG}" ]; then
        TAGS="${TAGS} -t ${CI_REGISTRY_IMAGE}:${VERSION} -t ${CI_REGISTRY_IMAGE}:latest -t ${CI_REGISTRY_IMAGE}:${YYMM}"
      elif [ "${CI_COMMIT_BRANCH}" = "beta" ]; then
        TAGS="${TAGS} -t ${CI_REGISTRY_IMAGE}:beta"
      fi

      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --build-arg VERSION="${VERSION}" \
        --build-arg BUILD_DATE="${BUILD_DATE}" \
        --build-arg COMMIT_ID="${COMMIT_ID}" \
        --label "org.opencontainers.image.vendor=${PROJECT_ORG}" \
        --label "org.opencontainers.image.authors=${PROJECT_ORG}" \
        --label "org.opencontainers.image.title=${PROJECT_NAME}" \
        --label "maintainer=${PROJECT_ORG}" \
        --label "org.opencontainers.image.base.name=${PROJECT_NAME}" \
        --label "org.opencontainers.image.schema-version=${VERSION}" \
        --label "org.opencontainers.image.vcs-type=Git" \
        --label "com.github.containers.toolbox=false" \
        --label "org.opencontainers.image.description=${PROJECT_NAME} - standard image (alpine)" \
        --label "org.opencontainers.image.licenses=MIT" \
        --label "org.opencontainers.image.created=${BUILD_DATE}" \
        --label "org.opencontainers.image.version=${VERSION}" \
        --label "org.opencontainers.image.revision=${COMMIT_ID}" \
        --label "org.opencontainers.image.url=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.documentation=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.vendor=${PROJECT_ORG}" \
        --annotation "manifest:org.opencontainers.image.authors=${PROJECT_ORG}" \
        --annotation "manifest:org.opencontainers.image.title=${PROJECT_NAME}" \
        --annotation "manifest:maintainer=${PROJECT_ORG}" \
        --annotation "manifest:org.opencontainers.image.base.name=${PROJECT_NAME}" \
        --annotation "manifest:org.opencontainers.image.schema-version=${VERSION}" \
        --annotation "manifest:org.opencontainers.image.vcs-type=Git" \
        --annotation "manifest:com.github.containers.toolbox=false" \
        --annotation "manifest:org.opencontainers.image.description=${PROJECT_NAME} - standard image (alpine)" \
        --annotation "manifest:org.opencontainers.image.licenses=MIT" \
        --annotation "manifest:org.opencontainers.image.created=${BUILD_DATE}" \
        --annotation "manifest:org.opencontainers.image.version=${VERSION}" \
        --annotation "manifest:org.opencontainers.image.revision=${COMMIT_ID}" \
        --annotation "manifest:org.opencontainers.image.url=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.documentation=${CI_PROJECT_URL}" \
        --push \
        -f docker/Dockerfile \
        ${TAGS} .
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
    # The standard image never builds on the scheduled pipeline - that slot belongs to docker:devel
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH

docker:devel:
  stage: docker
  image: docker:latest
  services:
