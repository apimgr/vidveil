test:
  image: ${BUILD_IMAGE}
  stage: test
  script:
    - go vet ./...
    - go test -buildvcs=false -cover -coverprofile=coverage.out ./...
    - |
      PCT="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print int($3)}')"
      if [ "${PCT}" -lt 60 ]; then
        echo "coverage ${PCT}% is below 60% threshold"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

